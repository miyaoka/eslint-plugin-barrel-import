# release-please が Conventional Commits から次のバージョンと CHANGELOG を算出し、リリース PR を維持する。
# リリース PR の merge で tag と GitHub Release を作る。npm への公開は publish.yml が Release を起点に行う
name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # GITHUB_TOKEN で作った PR の CI は承認待ちになり、作った Release は他の workflow を起動しない。
      # 専用 App のトークンなら PR の CI が自動で走り、Release が publish.yml を起動する。
      # 対象は現在のリポジトリに限り、release-please が要する権限だけを付与する
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
