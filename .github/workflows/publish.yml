name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public
